# Install once: pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: secret-scan
        name: secret scan (never commit keys)
        entry: python scripts/secret_scan.py --staged
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format --check
        language: system
        types: [python]
