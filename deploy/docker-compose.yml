# docker compose -f deploy/docker-compose.yml up -d --build
services:
  paper:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    volumes:
      - ../config.yaml:/app/config.yaml:ro
      - ../state:/app/state
    working_dir: /app
    command: ["python", "-m", "cryptobot", "paper"]
    restart: unless-stopped
